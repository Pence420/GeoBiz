services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geobiz}
      POSTGRES_USER: ${POSTGRES_USER:-geobiz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geobiz}
    ports:
      - "5432:5432"
    volumes:
      - geobiz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://geobiz:geobiz@db:5432/geobiz}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - geobiz-node-modules:/app/node_modules
    depends_on:
      - backend

  tiles:
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    command: ["--config", "/config/martin.yaml"]
    volumes:
      - ./data/tiles:/tiles:ro
      - ./data/tiles/martin.yaml:/config/martin.yaml:ro
    ports:
      - "3000:3000"

  tilemaker:
    image: ghcr.io/systemed/tilemaker:master@sha256:d32505d7827907089c2dd07517524276946d8930b4b82e93cf5c25ec989bbe41
    profiles: ["tools"]
    volumes:
      - ./data:/data

volumes:
  geobiz-postgres:
  geobiz-node-modules:
